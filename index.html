<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>NPC Visibility Recovery Tester</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@500;700;800&display=swap');

:root{
  --bg:#f6f6f4;
  --surface:#ffffff;
  --surface2:#f0f0ed;

  --text:#111;
  --muted:#888;
  --muted2:#aaa;

  --border:#d8d8d4;
  --border2:#bdbdb8;

  --green:#00a86b;
  --greenBg:#e8f7f1;

  --blue:#246bff;
  --blueBg:#ebf1ff;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:var(--bg);
  font-family:'JetBrains Mono', monospace;
  color:var(--text);
  padding:24px;
}

header{
  margin-bottom:18px;
  border-bottom:2px solid #111;
  padding-bottom:12px;
}

header h1{
  font-family:'Syne', sans-serif;
  font-size:1.35rem;
  font-weight:800;
}

header p{
  margin-top:4px;
  font-size:.72rem;
  color:var(--muted);
}

.layout{
  display:grid;
  grid-template-columns:300px 1fr;
  gap:18px;
}

@media(max-width:900px){
  .layout{
    grid-template-columns:1fr;
  }
}

.panel{
  background:var(--surface);
  border:1px solid var(--border2);
  border-radius:8px;
  overflow:hidden;
}

.panelBody{
  padding:18px;
}

.sectionTitle{
  font-family:'Syne', sans-serif;
  font-size:.7rem;
  text-transform:uppercase;
  letter-spacing:2px;
  color:var(--muted);
  margin-bottom:12px;
}

label{
  display:block;
  margin-top:12px;
  margin-bottom:5px;
  font-size:.68rem;
  color:var(--muted);
}

input{
  width:100%;
  padding:9px 10px;
  border:1px solid var(--border2);
  border-radius:5px;
  background:#fafafa;
  font-family:'JetBrains Mono', monospace;
}

button{
  width:100%;
  margin-top:12px;
  border:none;
  border-radius:5px;
  padding:11px;
  cursor:pointer;
  font-family:'Syne', sans-serif;
  font-weight:700;
}

.btnPrimary{
  background:#111;
  color:white;
}

.btnSecondary{
  background:#efefec;
  border:1px solid var(--border2);
}

.mainCol{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.phase{
  background:var(--surface);
  border:1px solid var(--border2);
  border-radius:8px;
  overflow:hidden;
}

.phaseHead{
  padding:14px 18px;
  border-bottom:1px solid var(--border);
  background:#f7f7f5;

  display:flex;
  align-items:center;
  gap:10px;
}

.phaseNum{
  width:22px;
  height:22px;
  border-radius:50%;
  background:#111;
  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-family:'Syne', sans-serif;
  font-size:.72rem;
  font-weight:800;
}

.phaseTitle{
  font-family:'Syne', sans-serif;
  font-size:1rem;
  font-weight:700;
}

.phaseBody{
  padding:20px;
}

.rowLabel{
  margin-bottom:8px;
  font-size:.7rem;
  letter-spacing:3px;
  color:var(--muted);
}

.row{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:20px;
}

.chip{
  width:72px;
  height:62px;
  border-radius:7px;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;

  font-size:1rem;
  font-weight:700;
}

.visibleTop{
  border:2px solid var(--green);
  background:var(--greenBg);
  color:var(--green);
}

.visibleBottom{
  border:2px solid var(--blue);
  background:var(--blueBg);
  color:var(--blue);
}

.hiddenTop{
  border:2px solid #bdbdb8;
  background:#f3f3f0;
  color:#888;
}

.hiddenBottom{
  border:2px solid #ccd5ef;
  background:#eef2ff;
  color:#7f8dbd;
}

.dropped{
  opacity:.2;
  text-decoration:line-through;
}

.tag{
  position:absolute;
  bottom:-16px;
  font-size:.55rem;
  color:#aaa;
}

.sep{
  width:3px;
  height:52px;
  background:#999;
  opacity:.35;
}

.connector{
  text-align:center;
  color:#aaa;
  font-size:.75rem;
}

.applyBtn{
  width:auto;
  padding:12px 18px;
}

.log{
  max-height:220px;
  overflow:auto;
}

.logEntry{
  padding:8px 18px;
  border-top:1px solid #eee;
  font-size:.72rem;
  color:#666;
}
</style>
</head>

<body>

<header>
  <h1>NPC · Recovery Logic Simulator</h1>
  <p>
    Row affinity → global fallback pairing → bottom-right empty enforcement
  </p>
</header>

<div class="layout">

  <!-- LEFT -->
  <div class="panel">
    <div class="panelBody">

      <div class="sectionTitle">Controls</div>

      <label>Viewport Columns</label>
      <input id="viewportCols" value="4" />

      <label>Top Row</label>
      <input id="topInput" value="A,B,C,D,E,F,G" />

      <label>Bottom Row</label>
      <input id="bottomInput" value="P,Q,R,S,T,U,V" />

      <button class="btnPrimary" onclick="init()">
        Reset & Shuffle
      </button>

      <button class="btnSecondary" onclick="nextRender()">
        Next Shuffle
      </button>

    </div>
  </div>

  <!-- RIGHT -->
  <div class="mainCol">

    <!-- PHASE 1 -->
    <div class="phase">

      <div class="phaseHead">
        <div class="phaseNum">1</div>
        <div class="phaseTitle">Shuffled State</div>
      </div>

      <div class="phaseBody">

        <div class="rowLabel">TOP ROW</div>
        <div class="row" id="topShuffle"></div>

        <div class="rowLabel">BOTTOM ROW</div>
        <div class="row" id="bottomShuffle"></div>

      </div>
    </div>

    <div class="connector">
      ↓ interleave into proximity ordering
    </div>

    <!-- PHASE 2 -->
    <div class="phase">

      <div class="phaseHead">
        <div class="phaseNum">2</div>
        <div class="phaseTitle">Visualizing the Flat Order</div>
      </div>

      <div class="phaseBody">

        <div class="row" id="interleaved"></div>

        <button
          class="btnPrimary applyBtn"
          onclick="recover()"
        >
          Apply Drops → Recover
        </button>

      </div>
    </div>

    <div class="connector">
      ↓ reconstruct rows
    </div>

    <!-- PHASE 3 -->
    <div class="phase">

      <div class="phaseHead">
        <div class="phaseNum">3</div>
        <div class="phaseTitle">Recovered Carousel State</div>
      </div>

      <div class="phaseBody">

        <div class="rowLabel">TOP ROW</div>
        <div class="row" id="finalTop"></div>

        <div class="rowLabel">BOTTOM ROW</div>
        <div class="row" id="finalBottom"></div>

      </div>
    </div>

    <!-- LOG -->
    <div class="phase">

      <div class="phaseHead">
        <div class="phaseNum">•</div>
        <div class="phaseTitle">Event Log</div>
      </div>

      <div class="log" id="log"></div>

    </div>

  </div>
</div>

<script>

/* =========================================================
   STATE
========================================================= */

const S = {
  viewport:4,
  top:[],
  bottom:[]
};

let shuffledTop = [];
let shuffledBottom = [];

let interleaved = [];

let dropped = new Set();

/* =========================================================
   HELPERS
========================================================= */

function log(msg){

  const el = document.createElement('div');

  el.className = 'logEntry';

  el.textContent = msg;

  document.getElementById('log').prepend(el);
}

function parse(str){

  return str
    .split(',')
    .map(x => x.trim())
    .filter(Boolean);
}

function shuffle(arr){

  const a = [...arr];

  for(let i=a.length-1;i>0;i--){

    const j = Math.floor(Math.random()*(i+1));

    [a[i],a[j]] = [a[j],a[i]];
  }

  return a;
}

/* =========================================================
   INTERLEAVE
========================================================= */

function buildInterleave(top,bottom){

  const res = [];

  const max = Math.max(top.length,bottom.length);

  for(let i=0;i<max;i++){

    if(top[i]){
      res.push({
        item:top[i],
        row:'top'
      });
    }

    if(bottom[i]){
      res.push({
        item:bottom[i],
        row:'bottom'
      });
    }
  }

  return res;
}

/* =========================================================
   GLOBAL PAIRING LOGIC
========================================================= */

function reconstruct(filtered){

  /*
    IMPORTANT FIX:

    Earlier logic greedily assigned
    lone survivors too early.

    Example:
    top: E
    bottom: U,Q,R

    old:
      E+U
      Q forced top
      R forced top

    new:
      E+U
      Q+R pair globally

    We now:
    1. Preserve row affinity initially
    2. Then globally pair leftovers
  */

  const topRes = [];
  const bottomRes = [];

  let topQueue = [];
  let bottomQueue = [];

  /* =========================================
     PASS 1
     preserve affinity
  ========================================= */

  filtered.forEach(e => {

    if(e.row === 'top'){
      topQueue.push(e.item);
    } else {
      bottomQueue.push(e.item);
    }
  });

  /* =========================================
     PHASE A
     pair original affinity first
  ========================================= */

  while(topQueue.length && bottomQueue.length){

    topRes.push(topQueue.shift());
    bottomRes.push(bottomQueue.shift());
  }

  /* =========================================
     PHASE B
     GLOBAL FALLBACK PAIRING

     leftover items pair together
     regardless of origin row
  ========================================= */

  const leftovers = [
    ...topQueue,
    ...bottomQueue
  ];

  while(leftovers.length){

    const a = leftovers.shift();

    if(a){
      topRes.push(a);
    }

    const b = leftovers.shift();

    if(b){
      bottomRes.push(b);
    }
  }

  /* =========================================
     FINAL STRICT COMPACTION

     ONLY bottom-right empties allowed

     if:
       top empty
       bottom exists

     move upward
  ========================================= */

  const max = Math.max(
    topRes.length,
    bottomRes.length
  );

  for(let i=0;i<max;i++){

    if(
      !topRes[i] &&
      bottomRes[i]
    ){
      topRes[i] = bottomRes[i];
      bottomRes[i] = undefined;
    }
  }

  return {
    top: topRes.filter(Boolean),
    bottom: bottomRes.filter(Boolean)
  };
}

/* =========================================================
   RENDER
========================================================= */

function makeChip(item,cls,rowName){

  const d = document.createElement('div');

  d.className = `chip ${cls}`;

  d.textContent = item;

  const t = document.createElement('div');

  t.className = 'tag';

  t.textContent = rowName;

  d.appendChild(t);

  return d;
}

function renderRow(arr,el,isTop){

  el.innerHTML = '';

  arr.forEach((x,i)=>{

    const visible =
      i < S.viewport;

    const cls =
      visible
        ? (isTop ? 'visibleTop' : 'visibleBottom')
        : (isTop ? 'hiddenTop' : 'hiddenBottom');

    el.appendChild(
      makeChip(
        x,
        cls,
        isTop ? 'TOP' : 'BTM'
      )
    );

    if(
      i === S.viewport-1 &&
      i !== arr.length-1
    ){
      const sep = document.createElement('div');
      sep.className = 'sep';
      el.appendChild(sep);
    }
  });
}

function renderInterleave(){

  const wrap =
    document.getElementById('interleaved');

  wrap.innerHTML = '';

  interleaved.forEach((e,i)=>{

    const inVp =
      i < S.viewport * 2;

    const cls =
      e.row === 'top'
      ? (inVp ? 'visibleTop' : 'hiddenTop')
      : (inVp ? 'visibleBottom' : 'hiddenBottom');

    const chip =
      makeChip(
        e.item,
        cls,
        e.row === 'top'
          ? 'TOP'
          : 'BTM'
      );

    if(dropped.has(e.item)){
      chip.classList.add('dropped');
    }

    chip.onclick = ()=>{

      if(dropped.has(e.item)){
        dropped.delete(e.item);
      } else {
        dropped.add(e.item);
      }

      renderInterleave();
    };

    wrap.appendChild(chip);

    if(
      i === (S.viewport*2)-1 &&
      i !== interleaved.length-1
    ){
      const sep = document.createElement('div');
      sep.className = 'sep';
      wrap.appendChild(sep);
    }
  });
}

/* =========================================================
   ACTIONS
========================================================= */

function recover(){

  const filtered =
    interleaved.filter(
      x => !dropped.has(x.item)
    );

  const result =
    reconstruct(filtered);

  renderRow(
    result.top,
    document.getElementById('finalTop'),
    true
  );

  renderRow(
    result.bottom,
    document.getElementById('finalBottom'),
    false
  );

  log(
    `Recovered → top:[${result.top.join(',')}]
     bottom:[${result.bottom.join(',')}]`
  );
}

function build(){

  shuffledTop = shuffle(S.top);
  shuffledBottom = shuffle(S.bottom);

  interleaved =
    buildInterleave(
      shuffledTop,
      shuffledBottom
    );

  renderRow(
    shuffledTop,
    document.getElementById('topShuffle'),
    true
  );

  renderRow(
    shuffledBottom,
    document.getElementById('bottomShuffle'),
    false
  );

  renderInterleave();

  document.getElementById('finalTop').innerHTML = '';
  document.getElementById('finalBottom').innerHTML = '';

  log(
    `Shuffle → top:[${shuffledTop.join(',')}]
     bottom:[${shuffledBottom.join(',')}]`
  );
}

function init(){

  S.viewport =
    parseInt(
      document.getElementById('viewportCols').value
    ) || 4;

  S.top =
    parse(
      document.getElementById('topInput').value
    );

  S.bottom =
    parse(
      document.getElementById('bottomInput').value
    );

  dropped = new Set();

  document.getElementById('log').innerHTML = '';

  build();
}

function nextRender(){

  dropped = new Set();

  build();
}

init();

</script>

</body>
</html>
